services:
  - type: web
    name: interviewbuddy-backend
    runtime: docker
    repo: https://github.com/ganeswarikuramdasu/InterviewBuddy
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0
      - key: SEED_DEMO_USERS
        value: "false"
      - key: DEMO_PASSWORD
        value: Passw0rd!
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      # When using the Supabase pooler (recommended for Render), the username is
      # per-project (postgres.<project-ref>), so it cannot have a fixed default.
      - key: DB_USERNAME
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: CODE_EXECUTION_SERVICE_URL
        value: ""
      - key: DDL_AUTO
        value: validate
      - key: MAIL_ENABLED
        value: "false"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_BASE_URL
        value: https://api.brevo.com/v3
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: InterviewBuddy
      - key: APP_FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false