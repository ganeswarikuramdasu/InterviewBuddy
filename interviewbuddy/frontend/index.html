<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterviewBuddy — AI-Powered Interview & Placement Preparation</title>
    <script>
      // InterviewBuddy uses a fixed light theme with dark UI elements baked in.
      // Strip any stale 'dark' class / saved preference so surfaces are never dark.
      document.documentElement.classList.remove('dark');
      try { localStorage.removeItem('interviewbuddy_theme_v2'); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
