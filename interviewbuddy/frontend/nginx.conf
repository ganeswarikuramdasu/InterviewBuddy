# ============================================================
# InterviewBuddy — nginx site config
# Serves the built React SPA and reverse-proxies /api to the
# Spring Boot backend. Only https is terminated upstream (e.g. a
# load balancer / Traefik / Caddy). This container itself runs http.
# ============================================================

server {
    listen 80;
    server_name _;

    # Maximum body for code submissions / API payloads (matches backend 5MB limit).
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API reverse proxy to the backend container ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;

        # Fail fast when the backend is unreachable instead of a 502 hang.
        proxy_next_upstream off;
    }

    # ---- Hashed static assets (long cache) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA history fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
