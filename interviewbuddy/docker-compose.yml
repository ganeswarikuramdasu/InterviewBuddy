# ============================================================
# InterviewBuddy — full-stack deployment (database = Supabase)
#
# Services:
#   backend   - Spring Boot API (health-checked via Spring Actuator)
#   frontend  - nginx serving the built React SPA + reverse-proxying /api
#
# The database is NOT part of this stack: it is a hosted Supabase
# (PostgreSQL) project. Requires a real .env with Supabase DB settings.
#
# Quick start:
#   cp .env.example .env        # then fill in Supabase connection + secrets
#   docker compose up -d --build
#   open http://localhost:8081  (nginx-frontend -> SPA + /api proxy)
#
# The default CORS_ALLOWED_ORIGINS is http://localhost:8081 because the SPA
# and API are served from the SAME origin through the nginx proxy, so no
# cross-origin requests occur in the default stack.
# ============================================================

name: interviewbuddy

services:
  backend:
    build:
      context: ./backend
    image: interviewbuddy-backend:1.0.0
    container_name: interviewbuddy-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # ---- Supabase / hosted PostgreSQL connection ----
      # Configure these in .env. DB_HOST is the Supabase hostname only.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      # ---- Application ----
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production-minimum-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CODE_EXECUTION_SERVICE_URL: ${CODE_EXECUTION_SERVICE_URL:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Passw0rd!}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_BASE_URL: ${BREVO_BASE_URL:-https://api.brevo.com/v3}
      MAIL_FROM: ${MAIL_FROM:-noreply@interviewbuddy.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-InterviewBuddy}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8081}}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - interviewbuddy-net

  frontend:
    build:
      context: ./frontend
    image: interviewbuddy-frontend:1.0.0
    container_name: interviewbuddy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - interviewbuddy-net

networks:
  interviewbuddy-net:
    driver: bridge