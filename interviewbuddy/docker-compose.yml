# ============================================================
# InterviewBuddy — full-stack production deployment
#
# Services:
#   postgres  - database (auto-loads schema.sql + seed.sql on first boot)
#   backend   - Spring Boot API (health-checked via Spring Actuator)
#   frontend  - nginx serving the built React SPA + reverse-proxying /api
#
# Quick start:
#   cp .env.example .env        # then fill in real secrets
#   docker compose up -d --build
#   open http://localhost:8081  (nginx-frontend -> SPA + /api proxy)
#
# The default CORS_ALLOWED_ORIGINS is http://localhost:8081 because the SPA
# and API are served from the SAME origin through the nginx proxy, so no
# cross-origin requests occur in the default stack.
# ============================================================

name: interviewbuddy

services:
  postgres:
    image: postgres:17-alpine
    container_name: interviewbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-interviewbuddy}
      POSTGRES_USER: ${DB_USERNAME:-interview}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-interview_dev_password}
    ports:
      # Expose only if you need to reach Postgres from the host (e.g. a GUI).
      # Comment out in production to keep the DB on the internal network.
      - "127.0.0.1:5432:5432"
    volumes:
      - interviewbuddy-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-interview} -d ${DB_NAME:-interviewbuddy}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - interviewbuddy-net

  backend:
    build:
      context: ./backend
    image: interviewbuddy-backend:1.0.0
    container_name: interviewbuddy-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-interviewbuddy}
      DB_USERNAME: ${DB_USERNAME:-interview}
      DB_PASSWORD: ${DB_PASSWORD:-interview_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production-minimum-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      CODE_EXECUTION_SERVICE_URL: ${CODE_EXECUTION_SERVICE_URL:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Passw0rd!}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8081}}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - interviewbuddy-net

  frontend:
    build:
      context: ./frontend
    image: interviewbuddy-frontend:1.0.0
    container_name: interviewbuddy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - interviewbuddy-net

networks:
  interviewbuddy-net:
    driver: bridge

volumes:
  interviewbuddy-postgres-data: