spring:
  datasource:
    url: jdbc:h2:mem:interviewbuddy_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

app:
  jwt:
    secret: test-secret-key-for-junit-tests-minimum-32-characters-long
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  demo:
    seed-users: false
  code-execution:
    base-url: ""
    min-solution-length: 20
  ai:
    gemini:
      api-key: ""
      model: gemini-3.6-flash
      base-url: https://generativelanguage.googleapis.com/v1beta
