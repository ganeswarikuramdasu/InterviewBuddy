#
# InterviewBuddy Backend — local dev profile (spring.profiles.active=local)
# Runs with an in-memory H2 database in PostgreSQL mode, so the whole stack
# works with zero external dependencies:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# The frontend dev server on :5173 proxies /api to localhost:8080.
#

spring:
  datasource:
    url: jdbc:h2:mem:interviewbuddy_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  jwt:
    secret: local-dev-secret-key-change-me-in-production-1234567890
  demo:
    seed-users: true
  mail:
    enabled: false
  ai:
    gemini:
      api-key: ""
  code-execution:
    base-url: ""