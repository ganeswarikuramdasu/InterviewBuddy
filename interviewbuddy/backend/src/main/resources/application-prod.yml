# ============================================================
# InterviewBuddy Backend — production profile (spring.profiles.active=prod)
# Only safe-to-expose endpoints are opened. Secrets are injected via
# environment variables (see docker-compose). Never commit real secrets.
# ============================================================

spring:
  jpa:
    hibernate:
      # In production the schema is owned by database/schema.sql (loaded
      # manually into the Supabase project, e.g. via the Supabase SQL editor
      # or psql). Hibernate must NOT auto-migrate. 'validate' fails startup
      # loudly if the schema drifts from the entities.
      # Override with DDL_AUTO if you intentionally use Hibernate-managed schema.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

# Actuator: expose only the health endpoint publicly (used by Docker healthcheck
# and uptime probes). Everything else stays internal.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: WARN
    com.interviewbuddy: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
